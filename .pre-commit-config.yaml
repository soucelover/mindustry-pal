repos:
  # Ruff hooks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      # Run the linter
      - id: ruff-check
        args: [--fix, --show-fixes]
      # Run the formatter
      - id: ruff-format

  # Pyrefly hook
  - repo: local
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking via uvx)
        entry: uv tool run --from pyrefly pyrefly check
        language: system
        pass_filenames: false
